# Production-style run of the API: gunicorn (multiple workers) + whitenoise for
# static + multiprocess Prometheus metrics.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build
#
# Async benchmark (ASGI + uvicorn workers, no code change):
#
#   GUNICORN_WORKER_CLASS=uvicorn.workers.UvicornWorker \
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     run --rm --service-ports api \
#     sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && \
#            gunicorn -c gunicorn.conf.py config.asgi:application"

services:
  api:
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn -c gunicorn.conf.py config.wsgi:application"
    environment:
      DJANGO_DEBUG: 0
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      GUNICORN_WORKER_CLASS: ${GUNICORN_WORKER_CLASS:-sync}
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus-multiproc
    tmpfs:
      - /tmp/prometheus-multiproc
